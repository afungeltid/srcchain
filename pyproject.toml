[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afungeltid-srcchain"
version = "0.1.0"
description = "沿片段的元数据向上追溯，打印完整的来源路径与偏移量"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "afungeltid" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://afungeltid.github.io"
Repository = "https://github.com/afungeltid/srcchain"
Issues = "https://github.com/afungeltid/srcchain/issues"

[project.scripts]
srcchain = "srcchain:main"

[tool.setuptools]
py-modules = ["srcchain"]
